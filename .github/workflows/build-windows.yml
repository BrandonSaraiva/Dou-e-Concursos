name: Criar executável Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - main.py
      - 'radar_dou/**'
      - requirements.txt
      - requirements-dev.txt
      - GERAR_EXE_WINDOWS.bat
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: radar-windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Obter código exato do commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python (apenas na máquina de compilação)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Testes do código
        run: python -m pytest -q
      - name: Compilar EXE Windows sem dependência de Python instalado
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RadarDOU --collect-all telegram --collect-all apscheduler --collect-all playwright --collect-all certifi main.py
          if (!(Test-Path dist/RadarDOU.exe)) { throw 'O executável não foi gerado' }
      - name: Autoteste do EXE realmente compilado
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/RadarDOU.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$env:TEMP\radar-dou-self-test-erro.txt") {
              Get-Content "$env:TEMP\radar-dou-self-test-erro.txt"
            }
            throw "Executável falhou no autoteste: $($process.ExitCode)"
          }
      - name: Gerar manifesto de integridade
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item dist/RadarDOU.exe downloads/RadarDOU.exe -Force
          "Código-fonte compilado: $env:GITHUB_SHA" | Set-Content -Encoding utf8 downloads/SOURCE_COMMIT.txt
          $hash = (Get-FileHash downloads/RadarDOU.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RadarDOU.exe" | Set-Content -Encoding ascii downloads/SHA256SUMS.txt
          Write-Host "SHA256: $hash"
      - name: Disponibilizar download como artefato
        uses: actions/upload-artifact@v4
        with:
          name: RadarDOU-Windows-${{ github.sha }}
          path: |
            downloads/RadarDOU.exe
            downloads/SOURCE_COMMIT.txt
            downloads/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Adicionar executável ao repositório automaticamente
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RadarDOU.exe downloads/SOURCE_COMMIT.txt downloads/SHA256SUMS.txt
          if ((git diff --cached --name-only).Length -eq 0) {
            Write-Host 'Mesmo executável já estava publicado.'
            exit 0
          }
          git commit -m "build: atualizar RadarDOU.exe compilado e validado [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
