name: Validar fixture de clipboard no Android 15
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clipboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Habilitar aceleração KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Copiar e colar pelas Configurações do Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2G
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -feature -Vulkan
          script: bash fixture.sh
      - name: Guardar registros do clipboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RadarDOU-Android-fixture-clipboard
          path: android-smoke/
          if-no-files-found: ignore
