name: Validar APK no Android 15
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  abrir-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 44638341424
          name: RadarDOU-Android-APK
          path: bin
      - name: Habilitar aceleração KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Instalar, abrir e reabrir o APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2G
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -feature -Vulkan
          script: bash scripts/test-android-apk.sh bin/RadarDOU.apk android-smoke
      - name: Guardar captura da tela e logs do Android
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RadarDOU-Android-teste-de-abertura
          path: android-smoke/
          if-no-files-found: ignore
