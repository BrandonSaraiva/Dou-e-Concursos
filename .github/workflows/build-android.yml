name: Criar APK Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Testes de código antes do APK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Preparar Buildozer e o SDK Android
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libffi-dev libltdl-dev libncurses-dev libssl-dev libtool pkg-config zip zlib1g-dev
          python -m pip install 'buildozer==1.6.0' 'Cython==0.29.37' setuptools
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          if [[ ! -e "$ANDROID_HOME/tools" ]]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          sed -i "/^android.ndk =/a android.sdk_path = $ANDROID_HOME\nandroid.ndk_path = $ANDROID_HOME/ndk/28.2.13676358\nandroid.skip_update = True" buildozer.spec
      - name: Compilar e validar o instalador ARM64 assinado
        run: |
          buildozer android debug
          shopt -s nullglob
          apks=(bin/*.apk)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" bin/RadarDOU.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose bin/RadarDOU.apk
          "$tools/aapt" dump badging bin/RadarDOU.apk > bin/apk-info.txt
          grep -F "package: name='org.radardou.monitor'" bin/apk-info.txt
          grep -F "native-code: 'arm64-v8a'" bin/apk-info.txt
      - name: Disponibilizar o instalador
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RadarDOU-Android-APK
          path: bin/RadarDOU.apk
          if-no-files-found: error
          retention-days: 30

  iniciar-apk:
    name: Abrir o APK ARM64 no Android
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RadarDOU-Android-APK
          path: bin
      - name: Habilitar aceleração KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Instalar, abrir e reabrir o APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2G
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -feature -Vulkan
          script: bash scripts/test-android-apk.sh bin/RadarDOU.apk android-smoke
      - name: Guardar captura da tela e logs do Android
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RadarDOU-Android-teste-de-abertura
          path: android-smoke/
          if-no-files-found: ignore
          retention-days: 30
