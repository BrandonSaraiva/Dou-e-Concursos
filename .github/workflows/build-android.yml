name: Validar colagem e publicar Radar DOU 1.2.2
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar depois que os testes passarem
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
jobs:
  colagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 44642115113
          name: RadarDOU-Android-APK
          path: bin
      - name: Habilitar aceleração KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Verificar colagem real no Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2G
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -feature -Vulkan
          script: bash scripts/test-android-apk.sh bin/RadarDOU.apk android-smoke
      - name: Guardar evidências do teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RadarDOU-Android-teste-de-colagem
          path: android-smoke/
          if-no-files-found: ignore
  publicar:
    if: inputs.publicar
    needs: colagem
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 44642115113
          name: RadarDOU-Android-APK
          path: bin
      - name: Publicar o instalador testado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd bin && sha256sum RadarDOU.apk > SHA256SUMS-Android.txt)
          cat notas-android-1.2.2.md > /tmp/notas-android-1.2.2.md
          printf '\n[Teste de colagem no Android 15](https://github.com/%s/actions/runs/%s)\n' "$GH_REPO" "$GITHUB_RUN_ID" >> /tmp/notas-android-1.2.2.md
          gh release create android-v1.2.2 bin/RadarDOU.apk bin/SHA256SUMS-Android.txt \
            --target da5b97e049afe754fdbf3041a92d613ca0d925fc \
            --title 'Radar DOU 1.2.2 para Android ARM64' \
            --notes-file /tmp/notas-android-1.2.2.md --latest=false
