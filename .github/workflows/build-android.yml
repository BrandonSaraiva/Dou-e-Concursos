name: Publicar APK Android 1.2.1 testado
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 44638341424
          name: RadarDOU-Android-APK
          path: bin
      - name: Publicar o instalador verificado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh run view 44640789247 --json conclusion --jq .conclusion)" = success
          printf '%s  RadarDOU.apk\n' 8eb92bfa5a139d6bd76e637c931cf486c5ed545dca33c5b69b5f746745db64fe > bin/SHA256SUMS-Android.txt
          (cd bin && sha256sum --check SHA256SUMS-Android.txt)
          gh release create android-v1.2.1 bin/RadarDOU.apk bin/SHA256SUMS-Android.txt \
            --target 8ab4d2e4817667ebfd163bfff1610523dffca798 \
            --title 'Radar DOU 1.2.1 para Android ARM64' \
            --notes-file notas-android-1.2.1.md --latest=false
