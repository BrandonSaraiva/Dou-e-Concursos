name: Criar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'main.py'
      - 'android_service.py'
      - 'radar_dou/**'
      - 'buildozer.spec'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Testes de código antes do APK
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q
      - name: Compilar aplicativo Android (Kivy / Buildozer)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable
          command: buildozer android debug
      - name: Disponibilizar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: RadarDOU-Android-APK
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
          retention-days: 30
